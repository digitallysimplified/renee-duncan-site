<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Portfolio | Dr. Renee Duncan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Josefin+Sans:wght@400&family=Corinthia&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Thins the handwriting strokes. Change radius (0.3 to 1) to make it thinner or thicker. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="thin-script"><feMorphology operator="erode" radius="0.7"/></filter>
    <filter id="thin-script-sm"><feMorphology operator="erode" radius="0.3"/></filter>
  </svg>

  <header class="masthead-wrap">
    <a href="index.html" class="masthead" aria-label="Dr. Renee Duncan, home" style="display:block">
      <span class="panel" aria-hidden="true"></span>
      <span class="rule left" aria-hidden="true"></span>
      <span class="rule right" aria-hidden="true"></span>
      <span class="dr">DR.</span>
      <span class="script">Renee</span>
      <span class="duncan">DUNCAN</span>
    </a>
  </header>

  <nav class="button-row" aria-label="Main">
    <a class="btn" href="index.html#about">About Renee</a>
    <a class="btn" href="index.html#publications">Publications</a>
    <a class="btn" href="portfolio.html">View Portfolio</a>
    <a class="btn" href="index.html#contact">Contact</a>
  </nav>

  <main>
    <section id="portfolio">
      <h2 class="section-heading"><span class="caps">View</span><span class="script" data-text="Portfolio"><span class="ink">Portfolio</span></span></h2>

      <!-- Password gate -->
      <form class="gate" id="gate" autocomplete="off">
        <h2>Private Portfolio</h2>
        <p>Please enter the password you were given to view my portfolio.</p>
        <label for="pw" class="hidden">Password</label>
        <input type="password" id="pw" placeholder="Password" required>
        <button class="btn" type="submit">Enter</button>
        <p class="error" id="err" role="alert"></p>
      </form>

      <!-- Portfolio (shown after password) -->
      <div id="content" class="hidden">
        <p class="intro" id="intro"></p>
        <p class="hint"><button class="link-btn" id="logout" type="button">Lock portfolio</button></p>
        <div id="grid"></div>
      </div>
    </section>
  </main>

  <!-- Viewer -->
  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-title">
    <div class="viewer-bar">
      <h3 id="viewer-title"></h3>
      <a class="link-btn" id="viewer-open" href="#" target="_blank" rel="noopener">Open in Google Drive</a>
      <button class="btn small" id="viewer-close" type="button">Close</button>
    </div>
    <div class="viewer-frame-wrap">
      <div class="loading">Loading&hellip;</div>
      <iframe id="viewer-frame" title="Portfolio item" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>
  </div>

  <footer>&copy; <span id="yr"></span> Dr. Renee Duncan &middot; Brisbane, Australia</footer>

  <script src="portfolio-items.js"></script>
  <script src="portfolio.js"></script>
</body>
</html>
