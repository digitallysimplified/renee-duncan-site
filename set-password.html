<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Make a portfolio password</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 560px; margin: 60px auto; padding: 0 20px; color: #111; }
    input, textarea { width: 100%; padding: 12px; font-size: 15px; margin: 8px 0 16px; box-sizing: border-box; }
    button { background: #000; color: #fff; border: 0; padding: 12px 24px; border-radius: 6px; cursor: pointer; }
  </style>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
  <h1>Make a new portfolio password</h1>
  <p>1. Type the new password. 2. Click the button. 3. Copy the code into <code>portfolio.js</code>, replacing the code inside the quotes after <code>PASSWORD_HASH =</code>.</p>
  <input id="pw" type="text" placeholder="New password">
  <button id="go">Make code</button>
  <textarea id="out" rows="3" readonly placeholder="Your code appears here"></textarea>
  <script>
/* Works on any connection. Uses the browser's built-in tool on HTTPS,
   and this small backup version on plain http. */
function sha256Fallback(ascii) {
  function rr(v, n) { return (v >>> n) | (v << (32 - n)); }
  const bytes = new TextEncoder().encode(ascii);
  const K = [], H = [];
  let isPrime = {}, c = 2;
  while (K.length < 64) {
    if (!isPrime[c]) {
      for (let i = c * c; i < 313; i += c) isPrime[i] = 1;
      if (H.length < 8) H.push((Math.pow(c, 1 / 2) * 4294967296) | 0);
      K.push((Math.pow(c, 1 / 3) * 4294967296) | 0);
    }
    c++;
  }
  const l = bytes.length, words = [];
  const padded = new Uint8Array(((l + 9 + 63) >> 6) << 6);
  padded.set(bytes); padded[l] = 0x80;
  const bitLen = l * 8, last = padded.length;
  padded[last - 4] = (bitLen >>> 24) & 255; padded[last - 3] = (bitLen >>> 16) & 255;
  padded[last - 2] = (bitLen >>> 8) & 255;  padded[last - 1] = bitLen & 255;
  for (let i = 0; i < padded.length; i += 4)
    words.push((padded[i] << 24) | (padded[i + 1] << 16) | (padded[i + 2] << 8) | padded[i + 3]);
  let h = H.slice();
  for (let j = 0; j < words.length; j += 16) {
    const w = words.slice(j, j + 16), old = h.slice();
    for (let i = 0; i < 64; i++) {
      if (i >= 16) {
        const w15 = w[i - 15], w2 = w[i - 2];
        w[i] = (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0;
      }
      const a = h[0], e = h[4];
      const t1 = (h[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & h[5]) ^ (~e & h[6])) + K[i] + w[i]) | 0;
      const t2 = ((rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & h[1]) ^ (a & h[2]) ^ (h[1] & h[2]))) | 0;
      h = [(t1 + t2) | 0].concat(h.slice(0, 7));
      h[4] = (h[4] + t1) | 0;
    }
    for (let i = 0; i < 8; i++) h[i] = (h[i] + old[i]) | 0;
  }
  return h.map(v => (v >>> 0).toString(16).padStart(8, '0')).join('');
}

async function sha256(text) {
  if (window.crypto && crypto.subtle) {
    try {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch (_) {}
  }
  return sha256Fallback(text);
}

    document.getElementById('go').onclick = async () => {
      const out = document.getElementById('out');
      out.value = await sha256(document.getElementById('pw').value);
      out.select();
    };
  </script>
</body>
</html>
